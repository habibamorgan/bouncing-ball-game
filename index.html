<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="start-screen">
        <h1>Bouncing Ball</h1>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
